# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

# Prefix: Ctrl-b on the login node (hopper-l-*), Ctrl-g on compute nodes,
# so nested compute-node tmux can be driven with a single prefix press.
# (Ctrl-g rather than Ctrl-v, which nvim needs for visual block.)
%if "#{m:hopper-l-*,#{host_short}}"
set -g prefix C-b
%else
set -g prefix C-g
unbind C-b
unbind C-v
bind C-g send-prefix
%endif

set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -g extended-keys on

set -g mouse on              # Enable mouse support
set -g focus-events on       # Enable focus events for better Vim integration
set -g set-clipboard on      # Enable system clipboard
set -g detach-on-destroy off # Don't exit from tmux when closing a session

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -T copy-mode-vi MouseDragEnd1Pane \
    send -X copy-pipe-no-clear \; \
    display-message -d 1200 "#[fg=#b4befe,bold] copied #{buffer_size}B #[fg=#6c7086]#{=/40/…:buffer_sample}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# =============================================
# MINIMAL THEME CONFIGURATION
# =============================================
# Define colors
BG_COLOR="#1A1D23" # Astronvim theme
BG_COLOR="#242933" # Nordic theme
ACTIVE_COLOR="#b4befe"
INACTIVE_COLOR="#6c7086"
TEXT_COLOR="#cdd6f4"
ACCENT_COLOR="#b4befe"

# Basic status bar setup
set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify left

# Status bar colors and style
set -g status-style "bg=$BG_COLOR,fg=$TEXT_COLOR"
set -g status-left-length 100
set -g status-right-length 100

# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"

# Message style
set -g message-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"

# Window status format - using dots instead of asterisks
set -g window-status-separator ""
set -g window-status-current-format "#[fg=$BG_COLOR,bg=$ACTIVE_COLOR,bold] #W "

# Window status separator
set -g window-status-separator ""
# Status left (session name with minimal styling)
set -g status-left "#[fg=$ACCENT_COLOR,bold]  #S #[fg=$INACTIVE_COLOR]│ "

set -g status-right "#{?#{@pbs_job},#[fg=$ACCENT_COLOR]󰒋 #{@pbs_job} #[fg=$INACTIVE_COLOR]│ ,}#[fg=$TEXT_COLOR]#{host_short} #[fg=$INACTIVE_COLOR]│ %H:%M "

run '~/.tmux/plugins/tpm/tpm'
